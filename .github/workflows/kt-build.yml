name: kt-build
on:
  push:
    branches: ['build-**']
permissions:
  contents: write
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      type: ${{ steps.t.outputs.type }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "type=$(python3 -c "import json;print(json.load(open('config.json')).get('type','kotlin'))")" >> "$GITHUB_OUTPUT"
  android:
    needs: detect
    if: needs.detect.outputs.type != 'godot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: prepare
        shell: bash
        run: |
          touch build.log
          python3 ci/prep.py 2>&1 | tee -a build.log
      - name: gradle
        shell: bash
        run: |
          cd "$(cat rootdir)"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          else gradle assembleDebug --no-daemon 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"; fi
      - name: collect
        if: always()
        shell: bash
        run: |
          mkdir -p out; cp build.log out/ 2>/dev/null || true
          f=$(find proj gen -name '*-debug.apk' 2>/dev/null | head -1)
          if [ -n "$f" ]; then cp "$f" out/app.apk; fi
      - name: release
        if: always()
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          files=$(ls out/* 2>/dev/null || true)
          gh release create "${GITHUB_REF_NAME}-apk" $files --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" -t "${GITHUB_REF_NAME}" -n "build"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with: { name: out-android, path: out, if-no-files-found: ignore, retention-days: 1 }
  godot:
    needs: detect
    if: needs.detect.outputs.type == 'godot'
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - name: tools
        run: apt-get update -qq && apt-get install -y -qq python3 unzip git >/dev/null
      - uses: actions/checkout@v4
      - name: prepare
        shell: bash
        run: |
          touch build.log
          python3 ci/prep.py 2>&1 | tee -a build.log
      - name: export
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          cp -rn /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12 >/dev/null 2>&1
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JH="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          for v in 4 4.3; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$SDK" "$JH" "$HOME" > ~/.config/godot/editor_settings-$v.tres
          done
          R="$GITHUB_WORKSPACE/$(cat rootdir)"
          godot --headless --path "$R" --import 2>&1 | tee -a build.log || true
          godot --headless --path "$R" --export-debug "$(cat presetname)" "$GITHUB_WORKSPACE/out-app.apk" 2>&1 | tee -a build.log
      - name: collect
        if: always()
        shell: bash
        run: |
          mkdir -p out; cp build.log out/ 2>/dev/null || true
          [ -f out-app.apk ] && cp out-app.apk out/app.apk || true
      - name: release
        if: always()
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          files=$(ls out/* 2>/dev/null || true)
          gh release create "${GITHUB_REF_NAME}-apk" $files --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" -t "${GITHUB_REF_NAME}" -n "build"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with: { name: out-godot, path: out, if-no-files-found: ignore, retention-days: 1 }
  cleanup:
    needs: [android, godot]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: delete build branch
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || true
